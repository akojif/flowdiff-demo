name: probe
on: workflow_dispatch
permissions: {}
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - shell: bash
        env:
          INPUT_FAIL-ON: behavior
          INPUT_FAIL_ON: behavior
        run: |
          echo "/bin/sh is $(readlink -f /bin/sh)"
          node -e 'console.log("direct  | hyphen:", process.env["INPUT_FAIL-ON"] ?? "(missing)", "| underscore:", process.env.INPUT_FAIL_ON ?? "(missing)")'
          npm exec --yes -- node -e 'console.log("npm exec | hyphen:", process.env["INPUT_FAIL-ON"] ?? "(missing)", "| underscore:", process.env.INPUT_FAIL_ON ?? "(missing)")'
