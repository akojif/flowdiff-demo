name: probe
on: workflow_dispatch
permissions: {}
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - shell: bash
        env:
          INPUT_FAIL-ON: behavior
          INPUT_FAIL_ON: behavior
        run: node -e 'console.log("hyphen name reaches node:", process.env["INPUT_FAIL-ON"] ?? "(missing)"); console.log("underscore name reaches node:", process.env.INPUT_FAIL_ON ?? "(missing)")'
